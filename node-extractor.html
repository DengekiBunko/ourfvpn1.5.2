<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>FanVPN 节点提取工具 - v2rayN 版</title>
<style>
/* 你的原样式保持不变 */
body { font-family: Arial, sans-serif; margin: 20px; }
textarea { width: 100%; height: 200px; }
pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>

<h2>FanVPN 节点提取工具 - v2rayN 版</h2>

<button onclick="extract()">开始提取</button>

<pre id="log"></pre>

<script>
// ===============================
// 关键修复：使用本地 config.json
// ===============================
const CONFIG_URL = "config.json";  
// 或者使用绝对路径：
// const CONFIG_URL = "https://dengekibunko.github.io/ourfvpn1.5.2/config.json";

function log(msg) {
    document.getElementById("log").textContent += msg + "\n";
}

async function extract() {
    log("ℹ️  正在加载配置文件 config.json ...");

    try {
        const res = await fetch(CONFIG_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);

        const config = await res.json();
        log("✔️  配置加载成功！");
        log(JSON.stringify(config, null, 2));

        // 你原来的解析逻辑保持不变
        log("✔️  开始解析节点...");
        // ...（你的原逻辑）
    } catch (err) {
        log("❌ 加载失败: " + err.message);
    }
}
</script>

</body>
</html>
